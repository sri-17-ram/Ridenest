# RideNest - Backend Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/saferide_kids?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=saferidekids-super-secret-key-for-jwt-authentication-2024-must-be-256-bits-long
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# GPS Configuration
app.gps.deviation-threshold-meters=200
app.gps.ping-interval-seconds=5

# Accident Detection Configuration
app.accident.driver-response-timeout-seconds=30
app.accident.g-force-threshold=3.0

# Firebase (FCM) Configuration - Set your Firebase config here
app.firebase.enabled=false
app.firebase.credentials-path=firebase-service-account.json

# Logging
logging.level.com.saferidekids=DEBUG
logging.level.org.springframework.security=WARN

spring.jpa.open-in-view=false
